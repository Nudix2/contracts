[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"

optimizer = true
optimizer_runs = 200
verbosity = 2

[rpc_endpoints]
localhost = "${LOCALHOST}"
bnb-mainnet = "${BSC_MAINNET_RPC_URL}"
bnb-testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bnb-mainnet = {key = "${ETHERSCAN_API_KEY}", chain = "56"}
bnb-testnet = {key = "${ETHERSCAN_API_KEY}", chain = "97"}

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
